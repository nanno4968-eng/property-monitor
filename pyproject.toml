[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "distressed-property-monitor"
version = "0.1.0"
description = "South African distressed-property opportunity monitor (lawful sale channels only) - zero-cost pipeline edition"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "jinja2>=3.1",
    "weasyprint>=62.0",
    "pypdf>=4.0",
    "pdfplumber>=0.11",
    "python-dateutil>=2.9",
    "rapidfuzz>=3.6",
    "geopy>=2.4",
    "tenacity>=8.2",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
